name: "CDDL Validation"

on:
  push:
    paths:
    - "cddl/**"
  pull_request:
    paths:
    - "cddl/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: "Validate CDDL Schema"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: "Checkout"
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: "Install Rust"
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

    - name: "Cache"
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
        key: cddl-${{ hashFiles('cddl/**') }}
        restore-keys: cddl-

    - name: "Install cddl"
      run: cargo install cddl --locked --force

    - name: "Validate"
      run: |
        for schema in cddl/*.cddl; do
          echo "Validating $schema"
          cddl compile-cddl --cddl "$schema"
        done
