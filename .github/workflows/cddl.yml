name: "CDDL Validation"

on:
  push:
    paths:
    - "cddl/**"
  pull_request:
    paths:
    - "cddl/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: "Validate CDDL Schema"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: "Install Rust"
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

    - name: "Cache"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
        key: cddl-${{ hashFiles('cddl/**') }}
        restore-keys: cddl-

    - name: "Install cddl"
      run: cargo install cddl --locked --force

    - name: "Validate"
      run: |
        for schema in cddl/*.cddl; do
          echo "Validating $schema"
          cddl compile-cddl --cddl "$schema"
        done
