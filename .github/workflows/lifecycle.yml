name: "Lifecycle Status"

on:
  push:
    branches: [main]
    paths:
      - MAINTAINERS.md
      - SECURITY.md
      - .github/workflows/lifecycle.yml
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: "Update Lifecycle Status"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect metrics
        id: metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Maintainer count and org count from MAINTAINERS.md table
          # Table rows start with "| " and contain "@" (GitHub ID column)
          MAINTAINER_ROWS=$(grep -E '^\| .+@' MAINTAINERS.md | grep -v 'emeritus' | grep -v 'GitHub ID' || true)
          MAINTAINER_COUNT=$(echo "$MAINTAINER_ROWS" | grep -c '@' || echo 0)
          ORG_COUNT=$(echo "$MAINTAINER_ROWS" | awk -F'|' '{print $NF}' | sed 's/^ *//;s/ *$//' | sort -u | grep -c '.' || echo 0)
          MAINTAINER_LIST=$(echo "$MAINTAINER_ROWS" | awk -F'|' '{gsub(/^ +| +$/,"",$2); gsub(/^ +| +$/,"",$NF); printf "%s (%s), ", $2, $NF}' | sed 's/, $//')

          # Contributor count (exclude bots)
          CONTRIBUTOR_COUNT=$(git shortlog -sn --all | grep -v -E '\[bot\]|ID Bot|dependabot' | wc -l | tr -d ' ')

          # Release count (tags matching v* or *-v*)
          TOTAL_RELEASES=$(git tag -l | wc -l | tr -d ' ')
          CURRENT_YEAR=$(date +%Y)
          YEARLY_RELEASES=$(git tag -l --sort=-creatordate | while read tag; do
            git log -1 --format='%ai' "$tag" 2>/dev/null
          done | grep "^$CURRENT_YEAR" | wc -l | tr -d ' ')

          # OpenSSF Scorecard workflow exists?
          SCORECARD_WORKFLOW="no"
          if ls .github/workflows/scorecard* 2>/dev/null; then
            SCORECARD_WORKFLOW="yes"
          fi

          echo "maintainer_count=$MAINTAINER_COUNT" >> "$GITHUB_OUTPUT"
          echo "org_count=$ORG_COUNT" >> "$GITHUB_OUTPUT"
          echo "maintainer_list=$MAINTAINER_LIST" >> "$GITHUB_OUTPUT"
          echo "contributor_count=$CONTRIBUTOR_COUNT" >> "$GITHUB_OUTPUT"
          echo "total_releases=$TOTAL_RELEASES" >> "$GITHUB_OUTPUT"
          echo "yearly_releases=$YEARLY_RELEASES" >> "$GITHUB_OUTPUT"
          echo "scorecard_workflow=$SCORECARD_WORKFLOW" >> "$GITHUB_OUTPUT"

      - name: Update LIFECYCLE.md
        env:
          MAINTAINER_COUNT: ${{ steps.metrics.outputs.maintainer_count }}
          ORG_COUNT: ${{ steps.metrics.outputs.org_count }}
          MAINTAINER_LIST: ${{ steps.metrics.outputs.maintainer_list }}
          CONTRIBUTOR_COUNT: ${{ steps.metrics.outputs.contributor_count }}
          TOTAL_RELEASES: ${{ steps.metrics.outputs.total_releases }}
          YEARLY_RELEASES: ${{ steps.metrics.outputs.yearly_releases }}
          SCORECARD_WORKFLOW: ${{ steps.metrics.outputs.scorecard_workflow }}
        run: |
          FILE="LIFECYCLE.md"

          update_section() {
            local marker="$1"
            local checkbox="$2"
            local label="$3"
            local detail="$4"
            local open="<!-- lifecycle:${marker} -->"
            local close="<!-- /lifecycle:${marker} -->"

            # Build replacement block
            local replacement
            replacement=$(printf '%s\n%s %s\n  - Current: %s\n%s' \
              "$open" "$checkbox" "$label" "$detail" "$close")

            # Use awk to replace between markers
            awk -v open="$open" -v close="$close" -v repl="$replacement" '
              $0 ~ open { skip=1; print repl; next }
              $0 ~ close { skip=0; next }
              !skip { print }
            ' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
          }

          # Maintainer count
          if [ "$MAINTAINER_COUNT" -ge 2 ] && [ "$ORG_COUNT" -ge 2 ]; then
            MC_CHECK="- [x]"
          else
            MC_CHECK="- [ ]"
          fi
          update_section "maintainer-count" "$MC_CHECK" \
            "**Multiple maintainers** — at least 2 from different organizations" \
            "${MAINTAINER_COUNT} maintainer(s), ${ORG_COUNT} organization(s): ${MAINTAINER_LIST}"

          # Contributor count
          if [ "$CONTRIBUTOR_COUNT" -ge 3 ]; then
            CC_CHECK="- [x]"
          else
            CC_CHECK="- [ ]"
          fi
          update_section "contributor-count" "$CC_CHECK" \
            "**Active contributors** — multiple non-maintainer contributors with merged PRs" \
            "${CONTRIBUTOR_COUNT} contributor(s)"

          # Release count (entry: at least 1)
          if [ "$TOTAL_RELEASES" -ge 1 ]; then
            RC_CHECK="- [x]"
          else
            RC_CHECK="- [ ]"
          fi
          update_section "release-count" "$RC_CHECK" \
            "**At least one release** — published artifacts exist" \
            "${TOTAL_RELEASES} crate release(s)"

          # Yearly releases (graduation: 2/year)
          if [ "$YEARLY_RELEASES" -ge 2 ]; then
            YR_CHECK="- [x]"
          else
            YR_CHECK="- [ ]"
          fi
          update_section "yearly-releases" "$YR_CHECK" \
            "**Minimum 2 releases per year**" \
            "${YEARLY_RELEASES} release(s) in $(date +%Y), ${TOTAL_RELEASES} total"

          # Org count (graduation: 3+)
          if [ "$ORG_COUNT" -ge 3 ]; then
            OC_CHECK="- [x]"
          else
            OC_CHECK="- [ ]"
          fi
          update_section "org-count" "$OC_CHECK" \
            "**MAINTAINERS.md lists 3+ organizations**" \
            "${ORG_COUNT} organization(s)"

          # Scorecard workflow
          if [ "$SCORECARD_WORKFLOW" = "yes" ]; then
            SC_CHECK="- [x]"
            SC_DETAIL="Workflow configured"
          else
            SC_CHECK="- [ ]"
            SC_DETAIL="Badge referenced in README, no workflow"
          fi
          update_section "scorecard" "$SC_CHECK" \
            "**OpenSSF Scorecard** — automated scoring in CI" \
            "$SC_DETAIL"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet LIFECYCLE.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automation/lifecycle-status-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add LIFECYCLE.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: update lifecycle status metrics" \
              --trailer "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs: update lifecycle status metrics" \
            --body "Automated update of LIFECYCLE.md status metrics." \
            --label "documentation"
