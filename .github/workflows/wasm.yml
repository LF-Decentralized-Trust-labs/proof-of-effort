name: "WASM Build"

on:
  push:
    paths:
    - "crates/cpop-protocol/**"
    - "Cargo.toml"
    - "Cargo.lock"
  pull_request:
    paths:
    - "crates/cpop-protocol/**"
    - "Cargo.toml"
    - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: "Build WASM Target"
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: "Install Rust"
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      with:
        targets: wasm32-unknown-unknown

    - name: "Cache"
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: wasm-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          wasm-

    - name: "Check (wasm32)"
      id: wasm-check
      run: cargo check -p cpop-protocol --target wasm32-unknown-unknown --features wasm
      # continue-on-error: getrandom 0.2 "js" feature is required for wasm but
      # transitive getrandom 0.3 (via cpop-jitter) lacks it. Remove once all
      # crates align on getrandom 0.3 with wasm-bindgen backend.
      continue-on-error: true

    - name: "Warn on WASM build failure"
      if: steps.wasm-check.outcome == 'failure'
      run: echo "::warning::WASM build failed; getrandom 0.3 wasm compatibility is unresolved"
