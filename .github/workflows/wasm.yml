name: "WASM Build"

on:
  push:
    paths:
    - "crates/cpop-protocol/**"
    - "Cargo.toml"
    - "Cargo.lock"
  pull_request:
    paths:
    - "crates/cpop-protocol/**"
    - "Cargo.toml"
    - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: "Build WASM Target"
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout"
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: "Install Rust"
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      with:
        targets: wasm32-unknown-unknown

    - name: "Cache"
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: wasm-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          wasm-

    - name: "Check (wasm32)"
      run: cargo check -p cpop-protocol --target wasm32-unknown-unknown --features wasm
      continue-on-error: true  # TODO: fix getrandom 0.3 wasm compat, then remove
