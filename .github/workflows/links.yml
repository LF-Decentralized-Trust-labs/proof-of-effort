name: "Link Check"

on:
  push:
    branches: [main]
    paths:
    - "**.md"
    - "docs/**"
  pull_request:
    paths:
    - "**.md"
    - "docs/**"
  schedule:
  - cron: "0 3 * * 1"  # Weekly Monday 3am UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: "Check Links"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: "Checkout"
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

    - name: "Check Links"
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: >-
          --no-progress
          --exclude-loopback
          --exclude 'mailto:'
          --exclude 'example.com'
          --exclude 'lists.lfdecentralizedtrust.org'
          --exclude 'c2pa-org/specs-core/pull'
          --exclude 'lf-decentralized-trust.github.io/governance'
          --exclude 'docs.github.com'
          --exclude 'c2pa.org'
          --exclude 'doi.org'
          --exclude 'iso.org'
          --exclude 'writerslogic'
          --exclude 'cawg.io'
          --exclude 'sagaftra.org'
          --exclude 'lf-decentralized-trust-labs.github.io/proof-of-effort/draft-condrey-cpoe'
          --exclude 'w3c-ccg.github.io/confidence-method'
          --timeout 30
          --max-retries 3
          --exclude-path 'draft-condrey-cpoe-protocol.md'
          --exclude-path 'draft-condrey-cpoe-appraisal.md'
          '*.md'
          'docs/**/*.md'
        fail: true
